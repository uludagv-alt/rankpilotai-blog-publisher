name: Publish RankPilotAI Blog

# Runs from a PUBLIC repo so GitHub Actions is free (the private rankpilotai-api /
# marketing repos hit the account Actions spending limit and their workflows
# fail to start). This repo holds NO secrets in code: WordPress credentials and a
# read-only deploy key for the content repo live in GitHub Secrets.
#
# Flow: clone the private rankpilotai-marketing (read-only) -> publish any blog
# post newer than the latest one already on WordPress (date-based, idempotent).

on:
  schedule:
    # Daily 06:00 UTC, after the ~05:00 UTC writer that pushes the day's post.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write # only for the keepalive heartbeat commit below

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Set up read-only deploy key for the content repo
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MARKETING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone blog content (private, read-only)
        run: |
          GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            git clone --depth 1 git@github.com:uludagv-alt/rankpilotai-marketing.git content

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Publish new posts
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 scripts/publish.py content/blog-posts

      # GitHub disables cron workflows in public repos after 60 days without
      # repo activity (runs don't count, only pushes). Refresh with a heartbeat
      # commit when the last push is older than 25 days. always() so persistent
      # publish failures still keep the schedule alive (a dead cron would hide
      # the failures entirely). Same pattern as suitberry-publisher.
      - name: Keepalive against 60-day cron auto-disable
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api repos/${{ github.repository }} -q .pushed_at || true)
          if [ -n "$last" ]; then
            age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          else
            age=999
          fi
          echo "last push: ${last:-unknown} (${age}d ago)"
          if [ "$age" -ge 25 ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" self
            cd self
            date -u +%FT%TZ > .heartbeat
            git add .heartbeat
            git -c user.name=keepalive -c user.email=keepalive@users.noreply.github.com commit -m "keepalive heartbeat"
            git push
          fi
